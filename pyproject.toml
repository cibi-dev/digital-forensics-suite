[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-forensics-suite"
version = "1.0.0"
description = "Enterprise Digital Forensics & Incident Response Suite"
readme = "README.md"
authors = [{ name = "cibi-dev", email = "cibi@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["forensics", "incident-response", "dfir", "merkle-tree", "network-analysis", "threat-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "networkx>=3.0,<4.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "blake3>=0.4.0,<2.0.0",
    "httpx>=0.27",
    "scikit-learn>=1.3.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.5",
    "mypy>=1.5.0",
]

[project.scripts]
forensics = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/crime-network-analyzer/src",
    "packages/forensic-timeline-reconstructor/src",
    "packages/entropy-file-carver/src",
    "packages/merkle-chain-custody/src",
    "packages/text-to-sql-forensic-agent",
    "packages/threat-log-detector/src",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", ".pytest_cache", ".mypy_cache"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^packages/.*/tests/',
    '^packages/.*/benchmarks/',
    '^packages/.*/examples/',
    '^\.venv/',
]
