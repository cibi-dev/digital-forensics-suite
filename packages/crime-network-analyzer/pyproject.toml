[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crime-network-analyzer"
version = "0.1.0"
description = "Enterprise-grade criminal network analysis engine for directed and bipartite forensic graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "cibi-dev", email = "cibi-dev@users.noreply.github.com" }
]
keywords = [
    "criminology",
    "forensics",
    "graph-analysis",
    "networkx",
    "fraud-detection",
    "centrality",
    "louvain",
    "gephi",
    "gexf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "networkx>=3.0,<4.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "bandit>=1.7",
    "mypy>=1.10",
    "cyclonedx-bom>=4.0",
]

[project.scripts]
crime-analyzer = "network.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/network"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/network"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
skips = ["B101"]
