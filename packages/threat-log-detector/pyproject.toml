[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-log-detector"
version = "0.1.0"
description = "Enterprise-grade unsupervised intrusion detection engine for Linux Auth.log, Syslog, and Network traffic using IsolationForest and Multivariable Z-Score"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "cibi-dev", email = "cibi-dev@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "bandit>=1.7.0,<2.0.0",
    "mypy>=1.10.0,<3.0.0",
]

[project.scripts]
threat-log-detector = "detector.cli:main"
threat-detector = "detector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/detector"]
branch = true
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
skips = ["B101"]
